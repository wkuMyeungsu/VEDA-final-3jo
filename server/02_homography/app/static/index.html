<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Homography</title><link rel="stylesheet" href="/static/homography.css">
</head>
<body>
  <h1>Homography</h1>
  <p class="muted">ArUco 마커 출력과 Homography 검증 전용 앱</p>
  <section>
    <h2>Homography</h2>
    <div class="row"><button onclick="selftest()">Selftest</button></div>
    <h3>ArUco 마커 묶음 생성</h3>
    <div class="row">
      <label>Config 경로<input id="config" value="../config/homography_grid.json"></label>
      <label>마지막 ID<input id="last-id" type="number" min="0" value="15"></label>
      <label>마커 크기(mm)<input id="marker-size" type="number" min="1" value="100"></label>
      <label>흰색 여백(mm)<input id="marker-margin" type="number" min="0" value="20"></label>
      <label>DPI<input id="dpi" type="number" value="300"></label>
      <label>이미지 형식<select id="format"><option value="png" selected>PNG</option><option value="svg">SVG</option></select></label>
      <label>ZIP 파일명<input id="zip-output" value="aruco_markers.zip"></label>
    </div>
    <button onclick="genMarkers()">마커 이미지 ZIP 생성</button>
    <div id="artifact" hidden><a id="download" download>ZIP 다운로드</a><iframe id="preview-frame" title="마커 미리보기"></iframe></div>
    <h3>수동 배치 호모그래피 산출</h3>
    <p class="hint">이미지를 올린 뒤 캔버스를 클릭해 원점과 축 방향을 표시합니다. ArUco의 ID와 네 모서리는 OpenCV가 자동 검출하며, 각 ID의 실제 마커 좌상단 좌표를 입력합니다.</p>
    <div class="row"><label>촬영 이미지<input id="solve-file" type="file" accept="image/*"></label><label>마커 한 변(mm)<input id="solve-size" type="number" value="100" min="1"></label><label>결과 파일명<input id="solve-output" value="homography_manual.json"></label></div>
    <div class="row"><button onclick="placeTool('origin')">원점 + 배치</button><button onclick="placeTool('x')">X축 방향 지정</button><button onclick="placeTool('y')">Y축 방향 지정</button><span id="tool-status" class="hint">도구를 선택하세요.</span></div>
    <canvas id="solve-image" width="1" height="1"></canvas>
    <div class="row"><button onclick="addMarkerRow()">마커 좌표 추가</button><button onclick="solveManual()">호모그래피 산출</button></div>
    <div id="marker-table"></div>
    <div id="solve-artifact" hidden><a id="solve-download" download>JSON 다운로드</a> · <a id="solve-overlay" target="_blank">검증 이미지 열기</a><br><img id="solve-result-image" alt="검증 결과"></div>
    <h3>기존 캘리브레이션</h3>
    <div class="row"><label>입력 이미지<input id="cal-input" value="capture.png"></label><label>출력 JSON<input id="cal-output" value="homography_ch1.json"></label><label>채널<input id="cal-channel" type="number" value="1"></label><label>RMSE 게이트(cm)<input id="cal-gate" type="number" value="2"></label></div>
    <button onclick="calibrate()">Calibrate</button>
    <h3>검증 뷰</h3>
    <div class="row"><label>Homography JSON<input id="view-h" value="homography_ch1.json"></label><label>출력 디렉터리<input id="view-dir" value="view_result"></label></div>
    <button onclick="viewResult()">View 생성</button>
    <pre id="result">결과가 여기에 표시됩니다.</pre>
  </section>
  <script src="/static/homography.js"></script>
</body>
</html>
