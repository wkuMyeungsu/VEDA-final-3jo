<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Server Operations Console</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:900px;margin:2rem auto;padding:0 1rem;color:#20252b;background:#f6f7f9}
    section{background:#fff;border:1px solid #dfe3e8;border-radius:10px;padding:1.2rem;margin:1rem 0}
    dl{display:grid;grid-template-columns:180px 1fr;gap:.7rem;margin:0}dt{font-weight:650}dd{margin:0}
    .active,.online{color:#18733b}.inactive,.failed,.offline{color:#b42318}.unknown{color:#806000}
    a{display:inline-block;padding:.7rem 1rem;background:#216eaa;color:#fff;border-radius:5px;text-decoration:none}
  </style>
</head>
<body>
  <h1>Server Operations Console</h1>
  <p>읽기 전용 운영 상태입니다. 1초마다 갱신됩니다.</p>
  <section>
    <h2>Runtime</h2>
    <dl>
      <dt>Safety server</dt><dd id="safety">확인 중</dd>
      <dt>MQTT TLS</dt><dd id="mqtt">확인 중</dd>
      <dt>Homography</dt><dd id="homography-state">확인 중</dd>
      <dt>Server log</dt><dd id="server-log">확인 중</dd>
      <dt>Runtime snapshot</dt><dd id="runtime-status">확인 중</dd>
      <dt>Last check</dt><dd id="checked">확인 중</dd>
    </dl>
  </section>
  <section><h2>Maintenance tool</h2><a id="homography" href="#">Open Homography App</a></section>
  <script>
    const setState=(id,value)=>{const node=document.getElementById(id);node.textContent=value;node.className=String(value).toLowerCase()};
    async function refresh(){
      try{
        const response=await fetch('/api/status',{cache:'no-store'});
        const value=await response.json();
        setState('safety',value.safety_server.state);
        setState('mqtt',value.mqtt.reachable?'online':'offline');
        setState('homography-state',value.homography.state);
        document.getElementById('server-log').textContent=value.server_log.modified_utc||'기록 없음';
        const snapshot=value.runtime_status&&value.runtime_status.snapshot;
        document.getElementById('runtime-status').textContent=snapshot
          ? `${snapshot.state||'unknown'} / queue drop ${snapshot.queue?.dropped??'?'}`
          : '기록 없음';
        document.getElementById('checked').textContent=value.checked_utc;
      }catch(error){setState('safety','unknown');setState('mqtt','unknown');setState('homography-state','unknown');document.getElementById('runtime-status').textContent='확인 실패'}
    }
    document.getElementById('homography').href='http://'+location.hostname+':8001';
    refresh();setInterval(refresh,1000);
  </script>
</body>
</html>
