<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>ArUCoCalibration</title>
  <style>
    body { font-family: sans-serif; max-width: 640px; margin: 20px auto; }
    fieldset { margin-bottom: 16px; }
    label { display: inline-block; width: 140px; }
    pre { background: #f4f4f4; padding: 8px; white-space: pre-wrap; word-break: break-all; }
  </style>
  <script>
    const paths = window.location.pathname.split('/');
    const app_id = paths[5];
    const base_uri = `${window.location.protocol}//${window.location.hostname}:${window.location.port}/opensdk/${app_id}`;

    const showResult = (elId, data) => {
      document.getElementById(elId).textContent = JSON.stringify(data, null, 2);
    };

    const postJson = (path, body, elId) => {
      fetch(base_uri + path, { method: 'POST', body: JSON.stringify(body) })
        .then(res => res.json())
        .then(data => showResult(elId, data))
        .catch(err => showResult(elId, { error: String(err) }));
    };

    const getJson = (path, elId) => {
      fetch(base_uri + path)
        .then(res => res.json())
        .then(data => showResult(elId, data))
        .catch(err => showResult(elId, { error: String(err) }));
    };

    function onSetBoard() {
      postJson('/board', {
        squares_x: Number(document.getElementById('squares_x').value),
        squares_y: Number(document.getElementById('squares_y').value),
        square_length_mm: Number(document.getElementById('square_length_mm').value),
        marker_length_mm: Number(document.getElementById('marker_length_mm').value),
      }, 'board_result');
    }

    function currentChannel() {
      return document.getElementById('channel').value;
    }

    function onDetect() {
      getJson(`/detect?channel=${currentChannel()}`, 'action_result');
    }

    function onCapture() {
      postJson('/capture', { channel: Number(currentChannel()) }, 'action_result');
    }

    function onStatus() {
      getJson(`/status?channel=${currentChannel()}`, 'action_result');
    }
  </script>
</head>

<body>
  <h2>ArUCoCalibration</h2>

  <fieldset>
    <legend>1. 보드 사양 등록</legend>
    <div><label for="squares_x">squares_x</label><input type="number" id="squares_x" value="7"></div>
    <div><label for="squares_y">squares_y</label><input type="number" id="squares_y" value="5"></div>
    <div><label for="square_length_mm">square_length_mm</label><input type="number" id="square_length_mm" value="30"></div>
    <div><label for="marker_length_mm">marker_length_mm</label><input type="number" id="marker_length_mm" value="22"></div>
    <button type="button" onclick="onSetBoard()">등록</button>
    <pre id="board_result"></pre>
  </fieldset>

  <fieldset>
    <legend>2. 채널별 검출 / 캡처 / 상태</legend>
    <div>
      <label for="channel">channel</label>
      <select id="channel">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
      </select>
    </div>
    <button type="button" onclick="onDetect()">Detect (미리보기)</button>
    <button type="button" onclick="onCapture()">Capture (누적 저장)</button>
    <button type="button" onclick="onStatus()">Status (진행 상황)</button>
    <pre id="action_result"></pre>
  </fieldset>
</body>

</html>
