<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>ArUCoCalibration</title>
  <script>
    const paths = window.location.pathname.split('/');
    const app_id = paths[5];
    const base_uri = `${window.location.protocol}//${window.location.hostname}:${window.location.port}/opensdk/${app_id}`;

    function onWriteEventLog() {
      var uri = base_uri + "/writeeventlog";
      const req = {
        log: document.getElementById("log").value,
      };
      const res = document.getElementById('write_response');
      sendData(uri, 'POST', req, res);
    }

    function onCheckTimeSetting() {
      var uri = base_uri + "/checksetting";
      const res = document.getElementById('time_response');
      fetch(uri)
        .then(response => {
          if (response.ok) {
            return response.json();
          }
          throw new Error('Request error');
        })
        .then(data => {
          console.log(data);
          let str = `<tr><td>${data.latest_changed}</td></tr>`;
          const result = document.getElementById('result');
          result.innerHTML = `<table><tr><th scope="col">LatestChanged</td></tr>${str}</table>`;
        }).catch(error => {
        console.error('Error', error);
      });
    }

    const sendData = (uri, method, req, res) => {
      fetch(uri, {
        method: method,
        body: JSON.stringify(req)
      }).then(response => {
        if (response.ok) {
          console.log(response.json());
          res.textContent = 'Pass';
        } else {
          throw new Error('request failed');
          res.textContent = 'Fail';
        }
      }).catch(error => {
        console.error('Error', error);
        res.textContent = 'Fail: ' + error;
      });
    }
  </script>
</head>

<body>
  <p>Write Log</p>
  <form>
    <input type="text" id="log" placeholder="Log 입력 ex) message" value="Hello, World!"/>
    <button type="button" onclick="onWriteEventLog()">Send</button>
    <div id="write_response"></div>
  </form>

  <p>Check Network Setting</p>
  <form>
    <button type="button" onclick="onCheckTimeSetting()">Check</button>
    <div id="result"></div>
  </form>
</body>

</html>
