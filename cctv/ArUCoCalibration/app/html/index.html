<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ArUCoCalibration</title>
  <style>
    :root {
      --bg: #f3f4f6;
      --card: #ffffff;
      --border: #e5e7eb;
      --text: #111827;
      --text-muted: #6b7280;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-bg: #eff6ff;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --radius: 10px;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
    }
    .app {
      max-width: 460px;
      margin: 0 auto;
    }
    .app-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }
    .app-header .logo {
      width: 30px; height: 30px;
      border-radius: 8px;
      background: var(--primary);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; font-weight: 700;
    }
    .app-header h1 {
      font-size: 16px;
      margin: 0;
      font-weight: 700;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .card-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .step-badge {
      width: 20px; height: 20px;
      border-radius: 50%;
      background: var(--primary-bg);
      color: var(--primary);
      font-size: 11px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .card-head h2 {
      font-size: 13px;
      margin: 0;
      font-weight: 600;
    }
    .card-head .sub {
      font-size: 11px;
      color: var(--text-muted);
      margin-left: auto;
    }

    .field-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }
    .field label {
      display: block;
      font-size: 10.5px;
      color: var(--text-muted);
      margin-bottom: 3px;
    }
    .field input[type="number"] {
      width: 100%;
      padding: 6px 8px;
      font-size: 13px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fafafa;
    }
    .field input[type="number"]:focus {
      outline: none;
      border-color: var(--primary);
      background: #fff;
    }

    .channels {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }
    .channels input { display: none; }
    .channels label {
      flex: 1;
      text-align: center;
      padding: 6px 0;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
    }
    .channels input:checked + label {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      font-weight: 600;
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 6px;
    }
    button {
      font-family: inherit;
      font-size: 12.5px;
      padding: 7px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #f9fafb;
      color: var(--text);
      cursor: pointer;
      transition: background 0.1s;
    }
    button:hover { background: #f0f1f3; }
    button.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      font-weight: 600;
    }
    button.primary:hover { background: var(--primary-hover); }
    button.ghost {
      background: transparent;
      color: var(--text-muted);
    }
    button.danger-ghost {
      background: transparent;
      color: var(--danger);
      border-color: #fecaca;
    }

    .inline {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .inline input[type="number"] {
      width: 56px;
      padding: 5px 6px;
      font-size: 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text);
      margin-bottom: 8px;
    }

    .hint {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--danger);
      background: var(--danger-bg);
      border-radius: 6px;
      padding: 6px 8px;
      margin-bottom: 8px;
    }

    .result {
      background: #f9fafb;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px;
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: 11px;
      line-height: 1.5;
      max-height: 170px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-all;
      color: #374151;
    }
    .result:empty::before {
      content: "결과 없음";
      color: #9ca3af;
      font-style: italic;
    }

    .gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .gallery:empty::before {
      content: "히스토리 없음";
      font-size: 11px;
      color: #9ca3af;
      font-style: italic;
    }
    .thumb {
      position: relative;
      width: 72px;
      height: 54px;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #e5e7eb;
    }
    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .thumb .idx {
      position: absolute;
      bottom: 2px;
      right: 3px;
      background: rgba(0,0,0,0.6);
      color: #fff;
      font-size: 9px;
      padding: 1px 4px;
      border-radius: 3px;
    }
    .thumb .del {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 16px;
      height: 16px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: rgba(220,38,38,0.85);
      color: #fff;
      font-size: 11px;
      line-height: 16px;
      text-align: center;
      cursor: pointer;
    }
    .thumb .del:hover { background: #dc2626; }
  </style>
  <script>
    const paths = window.location.pathname.split('/');
    const app_id = paths[5];
    const base_uri = `${window.location.protocol}//${window.location.hostname}:${window.location.port}/opensdk/${app_id}`;

    const showResult = (elId, data) => {
      document.getElementById(elId).textContent = JSON.stringify(data, null, 2);
    };

    const postJson = (path, body, elId) => {
      fetch(base_uri + path, { method: 'POST', body: JSON.stringify(body) })
        .then(res => res.json())
        .then(data => showResult(elId, data))
        .catch(err => showResult(elId, { error: String(err) }));
    };

    const getJson = (path, elId) => {
      fetch(base_uri + path)
        .then(res => res.json())
        .then(data => showResult(elId, data))
        .catch(err => showResult(elId, { error: String(err) }));
    };

    function onSetBoard() {
      postJson('/board', {
        squares_x: Number(document.getElementById('squares_x').value),
        squares_y: Number(document.getElementById('squares_y').value),
        square_length_mm: Number(document.getElementById('square_length_mm').value),
        marker_length_mm: Number(document.getElementById('marker_length_mm').value),
      }, 'board_result');
    }

    function onGetBoard() {
      getJson('/board', 'board_result');
    }

    function currentChannel() {
      return document.querySelector('input[name="channel"]:checked').value;
    }

    function onDetect() {
      getJson(`/detect?channel=${currentChannel()}`, 'action_result');
    }

    function onCapture() {
      postJson('/capture', { channel: Number(currentChannel()) }, 'action_result');
    }

    function onStatus() {
      getJson(`/status?channel=${currentChannel()}`, 'action_result');
    }

    function onDiscard(index) {
      const channel = currentChannel();
      fetch(`${base_uri}/discard`, {
        method: 'POST',
        body: JSON.stringify({ channel: Number(channel), index }),
      })
        .then(res => res.json())
        .then(data => {
          showResult('action_result', data);
          onLoadHistory();
        })
        .catch(err => showResult('action_result', { error: String(err) }));
    }

    function onReset() {
      postJson('/reset', { channel: Number(currentChannel()) }, 'action_result');
    }

    function onLoadHistory() {
      const channel = currentChannel();
      fetch(`${base_uri}/status?channel=${channel}`)
        .then(res => res.json())
        .then(data => {
          const gallery = document.getElementById('gallery');
          gallery.innerHTML = '';
          const count = (data.corners_per_capture || []).length;
          for (let i = 0; i < count; i++) {
            const thumb = document.createElement('div');
            thumb.className = 'thumb';
            const img = document.createElement('img');
            img.src = `${base_uri}/captures/image?channel=${channel}&index=${i}&t=${Date.now()}`;
            const idx = document.createElement('span');
            idx.className = 'idx';
            idx.textContent = `#${i}`;
            const del = document.createElement('button');
            del.className = 'del';
            del.type = 'button';
            del.textContent = '×';
            del.title = '이 캡처 삭제';
            del.onclick = () => onDiscard(i);
            thumb.appendChild(img);
            thumb.appendChild(idx);
            thumb.appendChild(del);
            gallery.appendChild(thumb);
          }
        })
        .catch(err => showResult('action_result', { error: String(err) }));
    }

    function onCalibrate() {
      postJson('/calibrate', {
        channel: Number(currentChannel()),
        rational_model: document.getElementById('rational_model').checked,
      }, 'calibrate_result');
    }

    function onGetResult() {
      getJson(`/result?channel=${currentChannel()}`, 'calibrate_result');
    }

    function onUndistort() {
      const img = document.getElementById('undistort_preview');
      img.src = `${base_uri}/undistort?channel=${currentChannel()}&t=${Date.now()}`;
      img.style.display = 'block';
    }
  </script>
</head>

<body>
  <div class="app">
    <div class="app-header">
      <div class="logo">A</div>
      <h1>ArUCoCalibration</h1>
    </div>

    <div class="card">
      <div class="card-head">
        <div class="step-badge">1</div>
        <h2>보드 등록</h2>
      </div>
      <div class="field-grid">
        <div class="field"><label for="squares_x">가로 칸 수</label><input type="number" id="squares_x" value="7"></div>
        <div class="field"><label for="squares_y">세로 칸 수</label><input type="number" id="squares_y" value="5"></div>
        <div class="field"><label for="square_length_mm">정사각형 (mm)</label><input type="number" id="square_length_mm" value="30"></div>
        <div class="field"><label for="marker_length_mm">마커 (mm)</label><input type="number" id="marker_length_mm" value="22"></div>
      </div>
      <div class="btn-row">
        <button class="primary" onclick="onSetBoard()">등록</button>
        <button class="ghost" onclick="onGetBoard()">조회</button>
      </div>
      <div class="result" id="board_result"></div>
    </div>

    <div class="card">
      <div class="card-head">
        <div class="step-badge">2</div>
        <h2>검출 · 캡처</h2>
        <span class="sub">채널별</span>
      </div>
      <div class="channels">
        <input type="radio" name="channel" id="ch1" value="1" checked><label for="ch1">CH 1</label>
        <input type="radio" name="channel" id="ch2" value="2"><label for="ch2">CH 2</label>
        <input type="radio" name="channel" id="ch3" value="3"><label for="ch3">CH 3</label>
        <input type="radio" name="channel" id="ch4" value="4"><label for="ch4">CH 4</label>
      </div>
      <div class="btn-row">
        <button onclick="onDetect()">Detect</button>
        <button class="primary" onclick="onCapture()">Capture</button>
        <button onclick="onStatus()">Status</button>
        <button class="ghost" onclick="onReset()">Reset</button>
        <button class="ghost" onclick="onLoadHistory()">히스토리</button>
      </div>
      <div class="result" id="action_result"></div>
      <div class="gallery" id="gallery"></div>
    </div>

    <div class="card">
      <div class="card-head">
        <div class="step-badge">3</div>
        <h2>캘리브레이션</h2>
        <span class="sub">4장+ (권장 10장+)</span>
      </div>
      <label class="checkbox-row"><input type="checkbox" id="rational_model"> rational_model 사용</label>
      <div class="btn-row">
        <button class="primary" onclick="onCalibrate()">Calibrate</button>
        <button onclick="onGetResult()">Result 조회</button>
        <button onclick="onUndistort()">Undistort 미리보기</button>
      </div>
      <div class="result" id="calibrate_result"></div>
      <img id="undistort_preview" style="display:none; width:100%; border-radius:6px; margin-top:8px; border:1px solid var(--border);">
    </div>
  </div>
</body>

</html>
